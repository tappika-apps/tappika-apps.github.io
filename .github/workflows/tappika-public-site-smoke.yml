name: Verify public táppika site

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'favicon.svg'
      - '.github/workflows/tappika-public-site-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Verify real public HTTPS and published content
        shell: bash
        env:
          CACHE_NONCE: ${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import os, time, urllib.request, urllib.error
          base = "https://tappika-apps.github.io/"
          nonce = os.environ["CACHE_NONCE"]
          expected = (
            '<title>táppika — Aplicaciones a medida</title>',
            '<meta name="robots" content="noindex, nofollow">',
            'href="mailto:info@tappika.es"',
            'href="https://wa.me/34620843264',
            'Esta página prepara tu mensaje, pero no guarda tus respuestas.',
            '¿Prefieres que te llamemos?',
            'Información legal de táppika',
          )
          error = None
          for attempt in range(1, 13):
            try:
              req = urllib.request.Request(base + "?qa=" + nonce + "-" + str(attempt), headers={"User-Agent": "tappika-public-qa/1.0", "Cache-Control": "no-cache"})
              with urllib.request.urlopen(req, timeout=20) as r:
                html = r.read().decode("utf-8")
                status = r.status
                ctype = r.headers.get("Content-Type", "")
              if status != 200 or "text/html" not in ctype:
                raise AssertionError("HTTP or MIME incorrect: %r %r" % (status, ctype))
              missing = [v for v in expected if v not in html]
              if missing:
                raise AssertionError("Published content missing: " + repr(missing))
              if "TÁPPIKA" in html or "Táppika" in html or "Tappika" in html:
                raise AssertionError("Wrong public brand capitalization")
              if "620 843 264" in html or "tel:+34620843264" in html:
                raise AssertionError("Personal phone number must not be shown")
              with urllib.request.urlopen(base + "favicon.svg?qa=" + nonce, timeout=20) as icon:
                svg = icon.read().decode("utf-8")
                if icon.status != 200 or 'stroke="#9770FF"' not in svg or 'M51 17 64 10' not in svg:
                  raise AssertionError("Published favicon mismatch")
              print("PUBLIC PASS: HTTPS 200, HTML, táppika, email, WhatsApp link, no visible phone, mailto notice, noindex, favicon.")
              print("URL:", base)
              print("HTML UTF-8 bytes:", len(html.encode("utf-8")))
              break
            except Exception as exc:
              error = repr(exc)
              print("Attempt %s/12 not yet verified: %s" % (attempt, error), flush=True)
              if attempt < 12: time.sleep(10)
          else:
            raise SystemExit("PUBLIC FAIL: " + str(error))
          PY

  browser-qa:
    needs: public-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test browser
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Test public site in desktop and mobile Chromium
        run: |
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          from urllib.parse import urlparse
          url = "https://tappika-apps.github.io/"
          with sync_playwright() as p:
            browser = p.chromium.launch(headless=True)
            for device, width, height in [("desktop", 1440, 900), ("mobile", 390, 844)]:
              page = browser.new_page(viewport={"width":width,"height":height})
              errors = []
              page.on("pageerror", lambda err: errors.append(str(err)))
              response = page.goto(url, wait_until="domcontentloaded", timeout=45000)
              assert response and response.status == 200, f"{device}: page HTTP"
              assert page.title() == "táppika — Aplicaciones a medida", f"{device}: title"
              assert page.locator(".wordmark").first.inner_text().strip() == "táppika", f"{device}: logo"
              page.locator('.tp-tbtn[data-type="pedidos"]').click()
              assert page.locator('[data-t="typeLabel"]').first.inner_text() == "Pedidos", f"{device}: generator type"
              assert page.locator('[data-screen="reservas"]').evaluate("e => e.hidden"), f"{device}: generator screen"
              page.locator('.tp-cbtn').nth(2).click()
              assert page.evaluate("document.documentElement.style.getPropertyValue('--c')") == "#D93A26", f"{device}: generator color"
              page.select_option('#q-quien', 'mi negocio')
              page.select_option('#q-plazo', 'lo antes posible')
              wa = page.locator('#tp-wa').get_attribute('href')
              assert wa.startswith("https://wa.me/34620843264?text=Hola%2C%20t%C3%A1ppika."), f"{device}: whatsapp text"
              assert "mi%20negocio" in wa, f"{device}: whatsapp answers"
              assert page.locator('#tp-mail').get_attribute('href').startswith("mailto:info@tappika.es?subject="), f"{device}: mail link"
              assert page.locator('[data-t="answered"]').inner_text() == "3", f"{device}: questionnaire progress"
              page.locator('#tp-wa').scroll_into_view_if_needed()
              assert page.locator('#tp-wa').is_visible() and page.locator('#tp-mail').is_visible(), f"{device}: contact buttons"
              page.locator('#tp-wa').click()
              assert page.locator('#tp-name-err').is_visible(), f"{device}: name must be required"
              page.fill('#q-nombre', 'Prueba')
              assert page.locator('#tp-name-err').is_hidden(), f"{device}: name error clears"
              page.locator('#q-llamar').check()
              assert page.locator('#tp-call').is_visible(), f"{device}: call-back fields"
              page.fill('#q-tel', '600000000')
              assert "llam%C3%A9is%20al%20600000000" in page.locator('#tp-wa').get_attribute('href'), f"{device}: call-back in message"
              assert page.locator('a[href^="tel:"]').count() == 0, f"{device}: phone must stay hidden"
              page.wait_for_timeout(400)
              assert page.evaluate("document.documentElement.scrollWidth <= innerWidth + 2"), f"{device}: horizontal overflow"
              assert not errors, f"{device}: script errors {errors}"
              print(f"BROWSER PASS: {device}, HTTP 200, logo, generator, questionnaire, contact links, no overflow/errors.")
              page.close()
            browser.close()
          PY
