name: Verify public táppika site

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'favicon.svg'
      - '.github/workflows/tappika-public-site-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Verify real public HTTPS and published content
        shell: bash
        env:
          CACHE_NONCE: ${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import os, time, urllib.request, urllib.error
          base = "https://tappika-apps.github.io/"
          nonce = os.environ["CACHE_NONCE"]
          expected = (
            '<title>táppika — Aplicaciones a medida</title>',
            '<meta name="robots" content="noindex, nofollow">',
            'href="mailto:info.tappika@gmail.com"',
            'href="tel:+34620843264"',
            '620 843 264',
            "const CONTACT_EMAIL = 'info.tappika@gmail.com';",
            'Esta web no envía el mensaje automáticamente.',
          )
          error = None
          for attempt in range(1, 13):
            try:
              req = urllib.request.Request(base + "?qa=" + nonce + "-" + str(attempt), headers={"User-Agent": "tappika-public-qa/1.0", "Cache-Control": "no-cache"})
              with urllib.request.urlopen(req, timeout=20) as r:
                html = r.read().decode("utf-8")
                status = r.status
                ctype = r.headers.get("Content-Type", "")
              if status != 200 or "text/html" not in ctype:
                raise AssertionError("HTTP or MIME incorrect: %r %r" % (status, ctype))
              missing = [v for v in expected if v not in html]
              if missing:
                raise AssertionError("Published content missing: " + repr(missing))
              if "TÁPPIKA" in html or "Táppika" in html or "Tappika" in html:
                raise AssertionError("Wrong public brand capitalization")
              with urllib.request.urlopen(base + "favicon.svg?qa=" + nonce, timeout=20) as icon:
                svg = icon.read().decode("utf-8")
                if icon.status != 200 or 'stroke="#9770FF"' not in svg or 'M51 17 64 10' not in svg:
                  raise AssertionError("Published favicon mismatch")
              print("PUBLIC PASS: HTTPS 200, HTML, táppika, email, phone, mailto warning, noindex, favicon.")
              print("URL:", base)
              print("HTML UTF-8 bytes:", len(html.encode("utf-8")))
              break
            except Exception as exc:
              error = repr(exc)
              print("Attempt %s/12 not yet verified: %s" % (attempt, error), flush=True)
              if attempt < 12: time.sleep(10)
          else:
            raise SystemExit("PUBLIC FAIL: " + str(error))
          PY
