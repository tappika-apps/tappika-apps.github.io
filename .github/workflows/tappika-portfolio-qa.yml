name: Verify táppika separate projects page
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'proyectos.html'
      - '.github/workflows/tappika-portfolio-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  portfolio:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Check independent portfolio and homepage navigation on HTTPS
        run: |
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          import time
          base="https://tappika-apps.github.io/"
          names=["BNevents","Mi Campo","Mi Semana","Agenda y reservas a medida"]
          with sync_playwright() as p:
            browser=p.chromium.launch(headless=True)
            for device,size in (("desktop",{"width":1440,"height":900}),("mobile",{"width":390,"height":844})):
              page=browser.new_page(viewport=size,locale="es-ES")
              errors=[]
              page.on("pageerror",lambda e:errors.append(str(e)))
              for attempt in range(1,20):
                r=page.goto(base+"?portfolioqa="+str(attempt),wait_until="domcontentloaded",timeout=30000)
                if r.status==200 and page.locator('a[href="proyectos.html"]').count()==1 and page.locator("#proyectos").count()==0:
                  break
                time.sleep(8)
              else: raise AssertionError("Homepage still contains inline portfolio")
              link=page.locator('a[href="proyectos.html"]')
              assert link.is_visible(), f"{device}: projects menu not visible"
              link.click()
              page.wait_for_load_state("domcontentloaded")
              assert page.url.startswith(base+"proyectos.html"),page.url
              assert page.locator("h1").inner_text()=="Proyectos realizados.",f"{device} h1"
              assert page.locator("article.case").count()==4
              bn_image=page.locator('img[src="assets/portfolio/bnevents.webp"]')
              assert bn_image.count()==1,"Real BNevents image not found"
              bn_image.scroll_into_view_if_needed()
              page.wait_for_function("() => Array.from(document.images).some(e => e.src.endsWith('bnevents.webp') && e.complete && e.naturalWidth>500)",timeout=25000)
              for name in names: assert page.get_by_role("heading",name=name,exact=True).count()==1
              assert page.get_by_role("heading",name="Agenda y reservas a medida").count()==1
              assert "Salud Navarro" not in page.content()
              assert "Alcantarilla" not in page.content()
              assert page.locator('meta[name="robots"]').get_attribute("content")=="noindex, nofollow"
              assert page.locator('a[href="aviso-legal.html"]').count()==1
              assert page.locator('a[href="privacidad.html"]').count()==1
              assert page.locator('a[href="cookies.html"]').count()==1
              page.get_by_role("searchbox").fill("invernaderos")
              assert page.locator('article.case:visible').count()==1
              assert page.get_by_role("heading",name="Mi Campo",exact=True).is_visible()
              page.get_by_role("searchbox").fill("")
              assert page.locator('article.case:visible').count()==4
              assert page.evaluate("document.documentElement.scrollWidth <= window.innerWidth+2")
              assert not errors,errors
              print("SEPARATE PORTFOLIO PASS",device,"HTTP 200, homepage free, four cards, mobile menu, search, anonymity and legal links")
              page.close()
            browser.close()
          PY
